name: Build

# Every push builds both apps and tests the update signature check.
# Pushing a version tag (v1.2.0) also publishes a GitHub Release with both apps, each signed with the release key.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Space Hunter.app (universal)
        working-directory: mac
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Test the update signature check (throwaway key)
        working-directory: mac/build
        run: |
          openssl genrsa -out t.pem 2048 2>/dev/null
          openssl rsa -in t.pem -RSAPublicKey_out -outform DER -out t.der 2>/dev/null
          BIN="Space Hunter.app/Contents/MacOS/SpaceHunter"
          cp "$BIN" payload; openssl dgst -sha256 -sign t.pem -out payload.sig payload
          "./$BIN" --test-verify payload payload.sig t.der
          printf x >> payload
          if "./$BIN" --test-verify payload payload.sig t.der; then echo "a tampered file was accepted"; exit 1; fi
          rm -f t.pem t.der payload payload.sig
      - name: Launch it and take a screenshot
        working-directory: mac
        run: |
          open "build/Space Hunter.app"
          sleep 12
          screencapture -x build/screenshot-main.png || true
          pgrep -lf SpaceHunter || (echo "App did not stay running" && exit 1)
          pkill -f "Space Hunter.app" || true
      - name: Zip the app
        working-directory: mac/build
        run: ditto -c -k --keepParent "Space Hunter.app" "SpaceHunter-mac.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: SpaceHunter-mac
          path: |
            mac/build/SpaceHunter-mac.zip
            mac/build/screenshot-*.png

  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build SpaceHunter.exe
        shell: cmd
        working-directory: windows
        run: build.cmd
      - name: Test the update signature check (throwaway key)
        shell: pwsh
        working-directory: windows
        run: |
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $p = $rsa.ExportParameters($false)
          $xml = "<RSAKeyValue><Modulus>$([Convert]::ToBase64String($p.Modulus))</Modulus><Exponent>$([Convert]::ToBase64String($p.Exponent))</Exponent></RSAKeyValue>"
          Set-Content t.xml $xml -NoNewline
          Copy-Item SpaceHunter.exe payload.bin
          $sig = $rsa.SignData([IO.File]::ReadAllBytes("payload.bin"), [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)
          [IO.File]::WriteAllBytes("payload.sig", $sig)
          $ok = Start-Process .\SpaceHunter.exe -ArgumentList "--test-verify payload.bin payload.sig t.xml" -Wait -PassThru
          if ($ok.ExitCode -ne 0) { throw "a correctly signed file was refused" }
          Add-Content payload.bin "x" -NoNewline
          $bad = Start-Process .\SpaceHunter.exe -ArgumentList "--test-verify payload.bin payload.sig t.xml" -Wait -PassThru
          if ($bad.ExitCode -eq 0) { throw "a tampered file was accepted" }
          Remove-Item t.xml, payload.bin, payload.sig
      - uses: actions/upload-artifact@v5
        with:
          name: SpaceHunter-windows
          path: windows/SpaceHunter.exe

  linux:
    name: Linux app
    # built on the oldest supported Ubuntu, so the AppImage also runs on older systems (glibc and GTK 4.6+)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK 4 and a virtual screen
        run: |
          # skip the manual-page index rebuild, which can stall package installs on these machines for many minutes
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 libgtk-4-dev xvfb xauth imagemagick || { sleep 20; sudo apt-get update -q; sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 libgtk-4-dev xvfb xauth imagemagick; }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - name: Build space-hunter
        working-directory: linux
        run: cargo build --release
      - name: Version check
        working-directory: linux
        run: |
          ./target/release/space-hunter --version
          ./target/release/space-hunter --version | grep -qx "Space Hunter $(tr -d '[:space:]' < ../VERSION)"
      - name: Test the cleaning engine on a throwaway folder
        working-directory: linux
        run: |
          set -eu
          BIN="$PWD/target/release/space-hunter"
          T="$HOME/sh-test"; rm -rf "$T"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" XDG_DATA_HOME="$RUNNER_TEMP/data"
          mkdir -p "$T/a/memory" "$T/keepme" "$XDG_CONFIG_HOME/space-hunter"
          echo "$T/keepme" > "$XDG_CONFIG_HOME/space-hunter/keep.txt"
          old() { printf '%s' "$2" > "$1"; touch -d '3 days ago' "$1"; }
          ok() { "$@" || { echo "FAILED: $*"; exit 1; }; }
          old "$T/old1.log" aaaa; old "$T/a/old2.log" bbbb
          old "$T/a/memory/mem.md" keep; old "$T/keepme/k.txt" keep
          echo new > "$T/new.txt"
          old "$RUNNER_TEMP/outside.txt" outside; ln -s "$RUNNER_TEMP/outside.txt" "$T/link.txt"

          echo "-- old files go; new, protected, memory and linked files stay"
          "$BIN" --test-engine "$T" --by-changed
          ok test ! -e "$T/old1.log"; ok test ! -e "$T/a/old2.log"
          ok test -e "$T/a/memory/mem.md"; ok test -e "$T/keepme/k.txt"; ok test -e "$T/new.txt"
          ok test -L "$T/link.txt"; ok test -e "$RUNNER_TEMP/outside.txt"

          echo "-- Trash mode: the file goes to the Trash, where it can be restored"
          old "$T/old3.log" cccc
          "$BIN" --test-engine "$T" --trash --by-changed
          ok test ! -e "$T/old3.log"; ok test -e "$XDG_DATA_HOME/Trash/files/old3.log"

          echo "-- sub-folders: an untouched project goes, one with a recent file stays"
          mkdir -p "$T/s/oldproj" "$T/s/newproj"
          old "$T/s/oldproj/f" x; old "$T/s/newproj/f1" y; echo z > "$T/s/newproj/f2"; touch -d '3 days ago' "$T/s/oldproj"
          "$BIN" --test-engine "$T/s" --subfolders --by-changed
          ok test ! -e "$T/s/oldproj"; ok test -e "$T/s/newproj/f1"

          echo "-- a file that arrived just now stays, even with an old date (copied or unzipped photos)"
          old "$T/arrived.jpg" photo
          "$BIN" --test-engine "$T"
          ok test -e "$T/arrived.jpg"

          echo "-- an empty folder a program just made stays; one this clean emptied goes"
          mkdir -p "$T/fresh-empty" "$T/e"; old "$T/e/gone.log" x
          "$BIN" --test-engine "$T" --by-changed
          ok test -d "$T/fresh-empty"; ok test ! -e "$T/e"

          echo "-- hand-picked files and folders go whatever their age; the rest, and picks outside the folder, stay"
          mkdir -p "$T/p/pickdir/deep" "$T/p/pickdir2"
          echo new > "$T/p/fresh.txt"; echo a > "$T/p/pickdir/a"; echo b > "$T/p/pickdir/deep/b"
          echo s > "$T/p/sibling.txt"; echo c > "$T/p/pickdir2/c"
          echo outside > "$RUNNER_TEMP/picked-outside.txt"
          "$BIN" --test-engine "$T/p" --pick "$T/p/fresh.txt" --pick "$T/p/pickdir|$T/p/pickdir/deep/b|$RUNNER_TEMP/picked-outside.txt|/etc/hostname"
          ok test ! -e "$T/p/fresh.txt"; ok test ! -e "$T/p/pickdir"
          ok test -e "$T/p/sibling.txt"; ok test -e "$T/p/pickdir2/c"; ok test -d "$T/p"
          ok test -e "$RUNNER_TEMP/picked-outside.txt"
          if [ -e /etc/hostname ]; then ok test -s /etc/hostname; fi

          echo "-- a folder owned by someone else (here root) is never entered"
          sudo mkdir -p "$T/rootowned"; sudo sh -c "printf x > '$T/rootowned/f'"; sudo touch -d '3 days ago' "$T/rootowned/f"
          "$BIN" --test-engine "$T" --by-changed
          ok test -e "$T/rootowned/f"
          sudo rm -rf "$T/rootowned"

          echo "-- folders outside your home and /tmp are refused"
          set +e; "$BIN" --test-engine /etc; code=$?; set -e
          ok test "$code" = 3
          set +e; "$BIN" --test-engine "$HOME"; code=$?; set -e
          ok test "$code" = 3

          echo "-- the password helper refuses to run without root"
          set +e; "$BIN" --clean-system apt:0; code=$?; set -e
          ok test "$code" = 2

          echo "-- what this machine has"
          "$BIN" --report
          rm -rf "$T"
      - name: Launch it on a virtual screen and take screenshots
        working-directory: linux
        env:
          GSK_RENDERER: cairo
        run: |
          mkdir -p "$HOME/sh-shot"; for i in $(seq 1 30); do head -c 300000 /dev/urandom > "$HOME/sh-shot/f$i.tmp"; done
          # something for Quick clean to find, as on a real PC: old temp files and thumbnails
          mkdir -p "$HOME/.cache/thumbnails/large" /tmp/sh-old
          for i in $(seq 1 40); do head -c 900000 /dev/urandom > "$HOME/.cache/thumbnails/large/t$i.png"; head -c 2000000 /dev/urandom > "/tmp/sh-old/build$i.o"; done
          find /tmp/sh-old -type f -exec touch -d '3 days ago' {} +
          shot() {   # name, then the app's arguments
            name=$1; shift
            xvfb-run -a -s "-screen 0 1280x860x24" sh -c "
              ./target/release/space-hunter --quit-after 14 $* & APP=\$!
              sleep 11
              import -window root screenshot-$name.png
              kill -0 \$APP || { echo 'App did not stay running'; exit 1; }
              wait \$APP"
          }
          shot main
          shot panel --open temp
          shot confirm --confirm
          shot cleaning --test-progress "$HOME/sh-shot"
          shot storage --storage "$HOME"
          shot storage-deep --storage "$HOME" --drill 3
          shot protect --protect
          # a folder of your own on the cleanup list, opened in its panel
          mkdir -p "$HOME/work/old-renders/2024 exports" "$HOME/work/old-renders/keep this"
          head -c 3000000 /dev/urandom > "$HOME/work/old-renders/final-cut.mp4"; echo notes > "$HOME/work/old-renders/notes.txt"
          head -c 800000 /dev/urandom > "$HOME/work/old-renders/2024 exports/a.png"
          find "$HOME/work/old-renders" -exec touch -d '90 days ago' {} +
          mkdir -p "$HOME/.config/space-hunter"
          echo "$HOME/work/old-renders" > "$HOME/.config/space-hunter/your-folders.txt"
          echo "$HOME/work/old-renders/keep this" > "$HOME/.config/space-hunter/your-folders-skip.txt"
          shot inside --open "custom:$HOME/work/old-renders"
          ls -l target/release/space-hunter screenshot-*.png
      - name: Test the update signature check (throwaway key)
        working-directory: linux
        run: |
          openssl genrsa -out t.pem 2048 2>/dev/null
          openssl rsa -in t.pem -RSAPublicKey_out -outform DER -out t.der 2>/dev/null
          cp target/release/space-hunter payload; openssl dgst -sha256 -sign t.pem -out payload.sig payload
          ./target/release/space-hunter --test-verify payload payload.sig t.der
          printf x >> payload
          if ./target/release/space-hunter --test-verify payload payload.sig t.der; then echo "a tampered file was accepted"; exit 1; fi
          rm -f t.pem t.der payload payload.sig
      - name: Make the AppImage
        working-directory: linux
        run: |
          set -eu
          mkdir -p AppDir/usr/bin
          cp target/release/space-hunter AppDir/usr/bin/
          cp ../mac/assets/AppIcon.iconset/icon_256x256.png AppDir/space-hunter.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Space Hunter' 'Comment=Find what fills your disk and clean it safely' \
            'Exec=space-hunter' 'Icon=space-hunter' 'Categories=System;Utility;' 'Terminal=false' > AppDir/space-hunter.desktop
          ln -sf usr/bin/space-hunter AppDir/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir SpaceHunter-x86_64.AppImage
          ls -l SpaceHunter-x86_64.AppImage
      - uses: actions/upload-artifact@v5
        with:
          name: SpaceHunter-linux
          path: linux/SpaceHunter-x86_64.AppImage
      - uses: actions/upload-artifact@v5
        with:
          name: SpaceHunter-linux-preview
          path: |
            linux/target/release/space-hunter
            linux/screenshot-*.png
            linux/Cargo.lock

  nix:
    name: Nix build (flake.nix)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: nix build
        run: nix build -L .#default && ls -l result/bin

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: The tag must match the VERSION file
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($V)"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: SpaceHunter-{windows,mac,linux}
          merge-multiple: true
      - name: Sign both apps with the release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "The RELEASE_SIGNING_KEY secret is missing: run tools/make-release-key.ps1 once"; exit 1; }
          umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > key.pem
          openssl rsa -in key.pem -pubout -out pub.pem 2>/dev/null
          # the apps were built with update-key/; the secret must be its other half, or every update would be refused
          openssl rsa -in key.pem -RSAPublicKey_out -outform DER 2>/dev/null | cmp -s - update-key/update-key.der \
            || { rm -f key.pem pub.pem; echo "RELEASE_SIGNING_KEY doesn't match update-key/update-key.der"; exit 1; }
          cd dist
          for f in SpaceHunter.exe SpaceHunter-mac.zip SpaceHunter-x86_64.AppImage; do
            openssl dgst -sha256 -sign ../key.pem -out "$f.sig" "$f"
            openssl dgst -sha256 -verify ../pub.pem -signature "$f.sig" "$f"
          done
          cd ..; rm -f key.pem pub.pem
      - name: Release notes (download table + this version's CHANGELOG.md section)
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed "s/VERSION/$V/g" .github/release-notes.md > notes.md
          awk -v v="$V" 'index($0, "## " v) == 1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > changes.md
          if [ -s changes.md ]; then cat changes.md >> notes.md; else echo "Space Hunter $V." >> notes.md; fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Space Hunter ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            dist/SpaceHunter.exe dist/SpaceHunter.exe.sig dist/SpaceHunter-mac.zip dist/SpaceHunter-mac.zip.sig \
            dist/SpaceHunter-x86_64.AppImage dist/SpaceHunter-x86_64.AppImage.sig
